<!doctype html><html lang="ja"><meta charset="utf-8"><title>Train control 部品調達確認</title><style>body{font:16px sans-serif;margin:24px;color:#172533}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:8px;text-align:left}input{width:150px}button,a{margin:5px;display:inline-block} .note{background:#fff2d5;padding:12px}</style><h1>Rev C 部品調達確認表</h1><p>WindowsのChromeで開いてください。10種類・合計50点です。コネクタは実装しません。</p><p class="note">これは確認用です。LCSCへの掲載だけではJLCPCBで実装できるとは限りません。メーカー型番・パッケージ・データシートを照合し、JLCPCB側でも実装可否を確認してください。検索結果は自動取得しません。</p><p>入力内容はこのタブを閉じると失われます。「CSVを保存」で保存してください。保存したCSVと各部品のデータシートをチャットに添付すると、回路・基板の照合を続けられます。</p><button id="save">確認結果をCSVで保存</button><table><thead><tr><th>対象／数量</th><th>候補型番・検索</th><th>LCSCコード</th><th>在庫数</th><th>JLCPCB実装</th><th>商品URL・備考</th></tr></thead><tbody id="rows"></tbody></table><script>const parts=[{"Comment": "MCP3008T-I/SL", "Designator": "U1", "Footprint": "Package_SO:SOIC-16_3.9x9.9mm_P1.27mm", "LCSC Part #": "", "Manufacturer": "Microchip", "Manufacturer Part Number": "MCP3008T-I/SL", "Quantity": "1", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "SN74HC221DR", "Designator": "U2,U3", "Footprint": "Package_SO:SOIC-16_3.9x9.9mm_P1.27mm", "LCSC Part #": "", "Manufacturer": "Texas Instruments", "Manufacturer Part Number": "SN74HC221DR", "Quantity": "2", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "SN74HC08DR", "Designator": "U4,U5,U6", "Footprint": "Package_SO:SOIC-14_3.9x8.7mm_P1.27mm", "LCSC Part #": "", "Manufacturer": "Texas Instruments", "Manufacturer Part Number": "SN74HC08DR", "Quantity": "3", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "MCP100T-300I/TT", "Designator": "U7", "Footprint": "Package_TO_SOT_SMD:SOT-23", "LCSC Part #": "", "Manufacturer": "Microchip", "Manufacturer Part Number": "MCP100T-300I/TT", "Quantity": "1", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "10k_1%", "Designator": "R6,R7,R8,R9,R10,R11,R12,R13,R14,R15,R16,R17,R18,R19,R20,R21,R22,R23,R24,R25,R26,R5", "Footprint": "Resistor_SMD:R_0805_2012Metric", "LCSC Part #": "", "Manufacturer": "Yageo", "Manufacturer Part Number": "RC0805FR-0710KL", "Quantity": "22", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "150k_1%", "Designator": "R1,R2,R3,R4", "Footprint": "Resistor_SMD:R_0805_2012Metric", "LCSC Part #": "", "Manufacturer": "Yageo", "Manufacturer Part Number": "RC0805FR-07150KL", "Quantity": "4", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "3224W-1-104E", "Designator": "VR1,VR2,VR3,VR4", "Footprint": "Potentiometer_SMD:Potentiometer_Bourns_3224W_Vertical", "LCSC Part #": "", "Manufacturer": "Bourns", "Manufacturer Part Number": "3224W-1-104E", "Quantity": "4", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "470nF_5%_X7R_50V", "Designator": "C1,C2,C3,C4", "Footprint": "Capacitor_SMD:C_1206_3216Metric", "LCSC Part #": "", "Manufacturer": "KEMET", "Manufacturer Part Number": "C1206C474J5RACTU", "Quantity": "4", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "100nF_X7R_50V", "Designator": "C5,C6,C7,C8,C9,C10,C11,C12", "Footprint": "Capacitor_SMD:C_0805_2012Metric", "LCSC Part #": "", "Manufacturer": "KEMET", "Manufacturer Part Number": "C0805C104K5RACTU", "Quantity": "8", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}, {"Comment": "10uF_X7R_25V", "Designator": "C13", "Footprint": "Capacitor_SMD:C_1206_3216Metric", "LCSC Part #": "", "Manufacturer": "KEMET", "Manufacturer Part Number": "C1206C106K3RACTU", "Quantity": "1", "Status": "CANDIDATE ONLY: LCSC listing, datasheet, stock and assembly eligibility not verified"}];
const tbody=document.getElementById('rows');
for(const [i,p] of parts.entries()){
 const tr=document.createElement('tr');
 const cell=t=>{const td=document.createElement('td');td.textContent=t;tr.append(td);return td};
 cell(p.Designator+' / '+p.Quantity+'個');const td=cell(p['Manufacturer Part Number']);
 for(const [label,url] of [['LCSCで検索','https://www.lcsc.com/search?q='],['JLCPCBで検索','https://jlcpcb.com/parts/componentSearch?searchTxt=']]){const a=document.createElement('a');a.textContent=label;a.href=url+encodeURIComponent(p['Manufacturer Part Number']);a.target='_blank';a.rel='noopener';td.append(a)}
 for(const key of ['LCSC Part #','Stock','JLCPCB assembly','URL / notes']){const td=cell('');if(key==='JLCPCB assembly'){const s=document.createElement('select');for(const t of ['未確認','対応を確認','非対応']){const o=document.createElement('option');o.textContent=t;s.append(o)}td.append(s);s.onchange=()=>p[key]=s.value}else{const input=document.createElement('input');input.placeholder=key==='LCSC Part #'?'Cから始まる番号':'';td.append(input);input.oninput=()=>p[key]=input.value}}
 tbody.append(tr);
}
document.getElementById('save').onclick=()=>{const keys=['Designator','Quantity','Manufacturer','Manufacturer Part Number','Footprint','LCSC Part #','Stock','JLCPCB assembly','URL / notes'];for(const p of parts){if(p['LCSC Part #']&&!/^C[0-9]+$/.test(p['LCSC Part #'])){alert('LCSCコードはCと数字で入力してください: '+p.Designator);return}}const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv='\ufeff'+[keys,...parts.map(p=>keys.map(k=>p[k]))].map(r=>r.map(q).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='TC_IO_REVC_catalog_review.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
